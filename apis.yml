name: AI Build
description: AI Build (Aibuild) is a London and Silicon Valley based software company,
  founded in 2015, that is transforming additive manufacturing with agentic AI. Its
  flagship Aibuild OS is an autonomous engineering platform whose computer-use AI operates
  CAD, CAE, and CAM software the way a human engineer would, carrying work from design
  intent through to manufacturing-ready output. Aibuild CAM provides toolpathing for
  large-format and robotic 3D printing, CNC machining, mould design, and analysis,
  while Aibuild FETS delivers finite element thermomechanical simulation. The company
  is a portfolio company of Seedcamp and SuperSeed and appears in the API Evangelist
  network as a company profile; it currently publishes no public API or developer platform.
